# jobcaliber config template — search inputs + generic criteria.
# Copy to config.yaml (gitignored) and edit. Every criterion carries its own question.
db_path: "./data/jobs.db"

# 1. Search inputs (the only bound part: they drive the boards).
search:
  titles: ["Backend Engineer", "Embedded Software Engineer", "Python Developer"]
  # Passed to the boards verbatim: use the spelling the board understands.
  on_site_locations: ["Turin, Italy"]
  remote_locations: ["Italy"]
  # Shown to the `applicable` criterion: postings matching one of these are not for this candidate.
  exclude: []


# 2. Criteria: scored dimensions (min/apply thresholds) or hard gates, each with a question.
#    Add your own: a new key + its question is all it takes.
criteria:
  core_skills:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: "score"
      instructions: >
        Are the candidate's core skills (c++ at level 5, python at level 4) in line
        with the skills the posting asks for?
      levels:
        [
          "Other skills only: the posting lists skills, but none of them are the candidate's",
          "Cannot tell: the posting does not say enough about skills to judge",
          "Partial: some of the candidate's core skills are requested",
          "Full: the candidate's core skills are a main requirement of the posting",
        ]
      missing: 1

  tools:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: "score"
      instructions: >
        Are the candidate's preferred tools in line with what the posting asks for?
        Preferred: Qt, Quantum Leaps QP, Git, Azure DevOps, Bitbucket, Bamboo, Jira,
        LLMs, integration/unit testing, code coverage, GTest, GCov, Coverity,
        SonarQube, database management, Snowflake.
      levels:
        [
          "Other tools only: the posting lists tools, but none of them are the candidate's",
          "Cannot tell: the posting does not say enough about tools to judge",
          "Partial: some of the candidate's preferred tools are requested",
          "Full: the candidate's preferred tools are a main requirement of the posting",
        ]
      missing: 1

  role_fit:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: "score"
      instructions: >
        Is this posting's role in line with the candidate's target roles:
        {{search.titles}}?
      levels:
        [
          "Other role: this is a different profession or family",
          "Cannot tell: the posting does not say enough about the role to judge",
          "Partial: adjacent role in the same family",
          "Full: exactly one of the target roles",
        ]
      missing: 1

  pay:
    apply_threshold: 0.75
    question:
      type: "score"
      instructions: >
        How close is the stated annual gross salary to the target of 40.000 EUR
        (minimum acceptable 38.000)?
      levels:
        ["Not stated", "Clearly below 38k", "Around 38-40k", "At the 40k target", "Above target"]
      missing: 0

  location:
    gate: { accept: ["accepted"] }
    question:
      type: "choice"
      instructions: >
        Is this job acceptable on location? The candidate lives in
        {{search.on_site_locations}} and wants to work there or 100% remote. Any on-site
        or hybrid work in a city outside {{search.on_site_locations}} is NOT acceptable.
      options:
        accepted: "Work is on-site or hybrid in {{search.on_site_locations}}, or 100% remote"
        rejected: "Work requires on-site or hybrid presence in a city outside {{search.on_site_locations}}, even if some remote days are offered"
        unknown: "The posting does not say where the work must be done"
      missing: "unknown"

  applicable:
    in_table: false
    gate: { accept: ["no"] }
    question:
      type: "choice"
      instructions: >
        Does this posting contain any of these exclusions: {{search.exclude}}? Read the
        job title first, then the description. Answer "yes" only if one of them is present.
      options:
        "yes": "Yes, the posting contains at least one of the exclusions"
        "no": "No, none of the exclusions appears in the posting"
        "missing": "The posting does not give enough information to tell"
      missing: "missing"

  contract_ok:
    gate: true
    question:
      type: "choice"
      instructions: >
        Is this a permanent employment contract? Answer "no" for partita IVA /
        freelance, internship, or agency contract.
      options:
        "yes": "Permanent employment contract"
        "no": "Partita IVA, freelance, internship or agency contract"
        "missing": "The contract type is not stated"
      missing: "missing"

penalties: { location: 0.8, pay: 0.85 }

# 3. Notification delivery & thresholds
notifications:
  telegram:
    enabled: true
    notify_threshold: 70
    review_threshold: 60
    min_confidence: 0.55
    quiet_hours: "22-08"
    digest_time: "20:00"

# 4. Scraping parameters
scraping:
  boards: ["linkedin", "indeed"]
  country: "italy"
  hours_old: null
  page_size: 50
  # Hard ceiling per query/board. Pagination also stops early when a page adds no new posting.
  board_max_results: { linkedin: 300, indeed: 500 }
  job_type: "fulltime"

# 5. Automation schedule
schedule:
  scrape_times: ["08:00"]
  backup_time: "03:00"

# 6. AI engines, roles, and prompt overrides.
# Local rizzo-flow (Jev wire protocol) is the scorer:
#   cd ~/rizzo-flow && uv run rizzo serve --port 8017 --device auto --quant q4_k_m
# Jev (opencode gateway, free) is kept as an alternative scorer; set OPENCODE_API_KEY.
ai:
  prompts_dir: "prompts"
  engines:
    rizzo:
      kind: "decision"
      api: "systemone"
      base_url: "http://127.0.0.1:8017"
      model: "rizzo-latest"
    jev:
      kind: "decision"
      api: "systemone"
      base_url: "https://opencode.ai/inference"
      model: "jev-1.13-free"
      api_key_env: "OPENCODE_API_KEY"
      # The free tier answers 429 in bursts: pace the calls and retry transient failures.
      throttle_s: 0.5
      retry: { max_attempts: 5, base_delay_s: 2.0, max_delay_s: 30.0 }
    local_llm:
      kind: "llm"
      api: "openai"
      base_url: "http://localhost:11434/v1"
      model: "qwen3:8b"
      options: { reasoning_effort: "none" }
    opencode_llm:
      kind: "llm"
      api: "openai"
      base_url: "https://opencode.ai/inference/go/v1"
      model: "deepseek-v4.1-flash"
      api_key_env: "OPENCODE_API_KEY"
      headers:
        x-opencode-session: "jobcaliber"
  roles:
    scorer: "rizzo"
  # Scoring rubrics are projected from `criteria`; no prompt file is read for scoring.
  custom_prompts: {}
