# jobcaliber config template — v11 (search inputs + generic criteria).
# Copy to config.yaml (gitignored) and edit. Every criterion carries its own question.
version: 11
db_path: "./data/jobs.db"

# 1. Search inputs (the only bound part: they drive the boards).
search:
  titles: ["Backend Engineer", "Embedded Software Engineer", "Python Developer"]
  locations:
    # Passed to the boards verbatim: use the spelling the board understands.
    - { query: "Turin, Italy", remote: false }
    - { query: "Italy", remote: true }

# 2. Criteria: weighted dimensions (weight > 0) or hard gates (gate), each with a question.
#    Add your own: a new key + its question is all it takes.
criteria:
  core_skills:
    weight: 45
    question:
      type: "score"
      instructions: "How well do the required skills match the candidate's core stack (c++ level 5, python level 4)?"
      levels:
        [
          "Not mentioned: the posting never refers to c++ or python",
          "Mentions the stack only as a nice-to-have, not required",
          "Requires one core skill (c++ or python) at any level",
          "Requires core skills as a main part of the role",
          "Core skills are the primary requirement",
        ]
      missing: null

  tools:
    weight: 20
    question:
      type: "score"
      instructions: "How many of the candidate's preferred tools are covered (Qt, FastAPI, CMake, Git)?"
      levels:
        [
          "None of the preferred tools are mentioned",
          "One minor overlap",
          "About half covered",
          "Most covered",
          "All or most covered",
        ]
      missing: null

  contract:
    weight: 20
    question:
      type: "score"
      instructions: "How well do contract type and seniority fit? Wanted: permanent, mid-senior."
      levels: ["Not stated", "Internship or junior-only", "Unclear or fixed-term", "Coherent permanent match"]
      missing: 0

  pay:
    weight: 15
    question:
      type: "score"
      instructions: "How close is the stated annual gross salary to 40.000 EUR?"
      levels: ["Not stated", "Clearly below", "Plausible", "At target", "Above target"]
      missing: 0

  location:
    gate: { accept: ["accepted"] }
    question:
      type: "choice"
      instructions: >
        Is this job acceptable to the candidate on location? The candidate lives in
        Sardinia, Italy, wants to work there or fully remote, and cannot relocate.
        Judge where the work must actually be done, using the declared location and
        any arrangement stated in the description.
      options:
        accepted: "On-site or hybrid in Sardinia, or fully remote from Italy"
        rejected: "Requires on-site or hybrid attendance outside Sardinia"
        unknown: "The posting does not say where the work must be done"
      missing: "unknown"


# Confidence multipliers applied when a criterion answer is missing.
penalties: { location: 0.8, pay: 0.85 }

# 3. Notification delivery & thresholds
notifications:
  telegram:
    enabled: true
    notify_threshold: 70
    review_threshold: 60
    min_confidence: 0.55
    quiet_hours: "22-08"
    digest_time: "20:00"

# 4. Scraping parameters
scraping:
  boards: ["linkedin", "indeed"]
  country: "italy"
  hours_old: null
  page_size: 50
  # Hard ceiling per query/board. Pagination also stops early when a page adds no new posting.
  board_max_results: { linkedin: 300, indeed: 500 }
  job_type: "fulltime"

# 5. Automation schedule
schedule:
  scrape_times: ["08:00"]
  backup_time: "03:00"

# 6. AI engines, roles, and prompt overrides.
# Local rizzo-flow (Jev wire protocol) is the scorer:
#   cd ~/rizzo-flow && uv run rizzo serve --port 8017 --device auto --quant q4_k_m
# Jev (opencode gateway, free) is kept as an alternative scorer; set OPENCODE_API_KEY.
ai:
  prompts_dir: "prompts"
  engines:
    rizzo:
      kind: "decision"
      api: "systemone"
      base_url: "http://127.0.0.1:8017"
      model: "rizzo-latest"
    jev:
      kind: "decision"
      api: "systemone"
      base_url: "https://opencode.ai/inference"
      model: "jev-1.13-free"
      api_key_env: "OPENCODE_API_KEY"
      # The free tier answers 429 in bursts: pace the calls and retry transient failures.
      throttle_s: 0.5
      retry: { max_attempts: 5, base_delay_s: 2.0, max_delay_s: 30.0 }
    local_llm:
      kind: "llm"
      api: "openai"
      base_url: "http://localhost:11434/v1"
      model: "qwen3:8b"
      options: { reasoning_effort: "none" }
    opencode_llm:
      kind: "llm"
      api: "openai"
      base_url: "https://opencode.ai/inference/go/v1"
      model: "deepseek-v4.1-flash"
      api_key_env: "OPENCODE_API_KEY"
      headers:
        x-opencode-session: "jobcaliber"
  roles:
    scorer: "rizzo"
    explainer: "local_llm"
    query_expander: "local_llm"
  # Override a prose prompt: prompts/explainer/<name>.md, prompts/query_expander/<name>.md.
  # Scoring rubrics are projected from `criteria` above, not read from files.
  custom_prompts: {}
