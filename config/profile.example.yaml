# profile.example.yaml - the template for profile.yaml: WHAT to look for and HOW to judge it.
# Copy to profile.yaml and edit. Any change here re-scores every posting.
search:
  titles:
    - Backend Engineer
    - Embedded Software Engineer
    - Python Developer
  on_site_locations:
    - Turin, Italy
  remote_locations:
    - Italy
  exclude: []
  job_type: fulltime
evaluation:
  systemone_min_confidence: 0.55
criteria:
  core_skills:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: score
      instructions:
        "Are the candidate's core skills (c++ at level 5, python at level 4) in line with
        the skills the posting asks for?"
      levels:
        - "Other skills only: the posting lists skills, but none of them are the candidate's"
        - "Cannot tell: the posting does not say enough about skills to judge"
        - "Partial: some of the candidate's core skills are requested"
        - "Full: the candidate's core skills are a main requirement of the posting"
      missing: 1
  tools:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: score
      instructions:
        "Are the candidate's preferred tools in line with what the posting asks for? Preferred:
        Qt, Quantum Leaps QP, Git, Azure DevOps, Bitbucket, Bamboo, Jira, LLMs, integration/unit testing,
        code coverage, GTest, GCov, Coverity, SonarQube, database management, Snowflake."
      levels:
        - "Other tools only: the posting lists tools, but none of them are the candidate's"
        - "Cannot tell: the posting does not say enough about tools to judge"
        - "Partial: some of the candidate's preferred tools are requested"
        - "Full: the candidate's preferred tools are a main requirement of the posting"
      missing: 1
  role_fit:
    min_threshold: 0.5
    apply_threshold: 0.67
    question:
      type: score
      instructions: "Is this posting's role in line with the candidate's target roles: {{search.titles}}?"
      levels:
        - "Other role: this is a different profession or family"
        - "Cannot tell: the posting does not say enough about the role to judge"
        - "Partial: adjacent role in the same family"
        - "Full: exactly one of the target roles"
      missing: 1
  pay:
    apply_threshold: 0.75
    question:
      type: score
      instructions:
        "How close is the stated annual gross salary to the target of 40.000 EUR (minimum
        acceptable 38.000)?"
      levels:
        - Not stated
        - Clearly below 38k
        - Around 38-40k
        - At the 40k target
        - Above target
      missing: 0
  location:
    gate:
      accept:
        - accepted
    question:
      type: choice
      instructions:
        "Is this job acceptable on location? The candidate lives in {{search.on_site_locations}}
        and wants to work there or 100% remote. Any on-site or hybrid work in a city outside {{search.on_site_locations}}
        is NOT acceptable."
      options:
        accepted: Work is on-site or hybrid in {{search.on_site_locations}}, or 100% remote
        rejected:
          Work requires on-site or hybrid presence in a city outside {{search.on_site_locations}},
          even if some remote days are offered
        unknown: The posting does not say where the work must be done
      missing: unknown
  applicable:
    gate:
      accept:
        - "no"
    question:
      type: choice
      instructions:
        'Does this posting contain any of these exclusions: {{search.exclude}}? Read the job
        title first, then the description. Answer "yes" only if one of them is present.'
      options:
        "yes": Yes, the posting contains at least one of the exclusions
        "no": No, none of the exclusions appears in the posting
        missing: The posting does not give enough information to tell
      missing: missing
  contract_ok:
    gate: true
    question:
      type: choice
      instructions:
        'Is this a permanent employment contract? Answer "no" for partita IVA / freelance,
        internship, or agency contract.'
      options:
        "yes": Permanent employment contract
        "no": Partita IVA, freelance, internship or agency contract
        missing: The contract type is not stated
      missing: missing
