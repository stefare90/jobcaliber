# settings.example.yaml - the template for settings.yaml: HOW the system runs.
# Copy to settings.yaml and edit. Changes here never re-score anything.
# Where the database lives. On a server this is the only copy; on a development checkout point it
# at a throwaway file (e.g. ./data/dev.db) so experiments never touch the history.
db_path: ./data/jobs.db
scraping:
  boards:
    - linkedin
    - indeed
  page_size: 50
  board_max_results:
    linkedin: 300
    indeed: 500
  board_country: italy
schedule:
  timezone: Europe/Rome
  scrape_times:
    - 08:00
  backup_time: 03:00
notifications:
  # Where the links inside a message point: the web app as the phone sees it.
  base_url: http://192.168.1.28:8765
  telegram:
    enabled: false
    chat_id: null
ai:
  prompts_dir: prompts
  engines:
    rizzo:
      kind: decision
      api: systemone
      base_url: http://127.0.0.1:8017
      model: rizzo-latest

# Optional: the engine lives on another machine that can be powered on and off (see
# docs/INSTALL.md#split-setup-controller--model-host). Leave it out for a local engine.
#   model_host:
#     address: 10.10.0.2          # required when wake_on_lan or poweroff_command is set
#     wake_on_lan: { mac: "34:5a:60:a2:87:9c", broadcast: "10.10.0.255", wait_s: 150 }
#     start_command: "ssh -i /home/you/.ssh/host-start -o BatchMode=yes you@10.10.0.2"
#     stop_command: "ssh -i /home/you/.ssh/host-stop -o BatchMode=yes you@10.10.0.2"
#     poweroff_command: "ssh -i /home/you/.ssh/host-poweroff -o BatchMode=yes you@10.10.0.2"

    jev:
      kind: decision
      api: systemone
      base_url: https://opencode.ai/inference
      model: jev-1.13-free
      api_key_env: OPENCODE_API_KEY
      throttle_s: 0.5
      retry:
        max_attempts: 5
        base_delay_s: 2.0
        max_delay_s: 30.0
    qwen3_llm:
      kind: llm
      api: openai
      base_url: http://localhost:11434/v1
      model: qwen3:8b
      options:
        reasoning_effort: none
    opencode_llm:
      kind: llm
      api: openai
      base_url: https://opencode.ai/inference/go/v1
      model: deepseek-v4.1-flash
      api_key_env: OPENCODE_API_KEY
      headers:
        x-opencode-session: jobcaliber
  roles:
    scorer: rizzo
  custom_prompts: {}
