[project]
name = "jobcaliber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pandas>=2.1,<3",
    "pydantic>=2",
    "python-jobspy==1.1.82",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
jobcaliber = "jobcaliber.entrypoints.cli:main"
jobcaliber-worker = "jobcaliber.entrypoints.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcaliber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
